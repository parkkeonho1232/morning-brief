name: setup check
# 설정 점검용 (수동 실행): 텔레그램 연결 메시지 + API 키 유효성

on:
  workflow_dispatch:
    inputs:
      telegram:
        description: "텔레그램 테스트 메시지도 보내기"
        type: boolean
        default: false
      report_date:
        description: "이 날짜(YYYY-MM-DD)의 사건·카드 요약 출력 (품질 점검용)"
        type: string
        default: ""
      refresh_videos_date:
        description: "이 날짜 카드에 유튜브 검색 결과만 다시 붙이기 (LLM 없음)"
        type: string
        default: ""
      chats:
        description: "봇에게 말을 건 사람의 chat id 목록 보기 (새 수신자 등록용)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: collector/pyproject.toml }
      - run: pip install ./collector
      - run: morning-brief check-keys
      - if: ${{ always() }}
        run: morning-brief embed-quota
      - if: ${{ inputs.telegram }}
        run: morning-brief telegram-test
      - if: ${{ inputs.chats }}
        run: morning-brief telegram-chats
      - if: ${{ inputs.refresh_videos_date != '' }}
        run: morning-brief refresh-videos --date ${{ inputs.refresh_videos_date }}
      - if: ${{ inputs.report_date != '' }}
        run: morning-brief report --date ${{ inputs.report_date }}
