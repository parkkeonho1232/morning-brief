name: daily briefing (05:30 KST)
# 매일 05:30 KST: 번역 마무리 → 묶기 → 사건 연결 → 변화 감지 (→ 1-4: 카드·브리핑)

on:
  # 예약: Supabase pg_cron이 20:30 UTC(=05:30 KST)에 send=true로, 07:00·11:00 UTC(=16·20시 KST)에 update=true로 깨운다 (0005·0006)
  workflow_dispatch:
    inputs:
      date:
        description: "기준일 YYYY-MM-DD (비우면 오늘 KST)"
        type: string
        default: ""
      calibrate:
        description: "배치 대신 임계값 보정용 유사도 분포만 출력"
        type: boolean
        default: false
      send:
        description: "수동 실행 때도 텔레그램·메일 브리핑 발송"
        type: boolean
        default: false
      update:
        description: "오후 업데이트: 아침 이후 기사로 오늘 카드 갱신 (send면 새 카드 텔레그램 알림)"
        type: boolean
        default: false
      resend:
        description: "배치 없이 그날 카드로 브리핑만 다시 발송 (date 필요)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"                       # 로그를 실시간으로 (멈춘 단계 확인용)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      BRIEFING_EMAIL_TO: ${{ secrets.BRIEFING_EMAIL_TO }}
      HF_HOME: /home/runner/.cache/huggingface   # bge-m3 예비 모델 캐시
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: collector/pyproject.toml }
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          key: hf-bge-m3
      - uses: actions/cache/restore@v4       # 기사 임베딩 캐시 (다음 실행이 같은 기사를 다시 계산하지 않게)
        with:
          path: /home/runner/.cache/morning-brief
          key: emb-${{ github.run_id }}
          restore-keys: emb-
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu "./collector[embed]"
      - run: morning-brief migrate
      - if: ${{ inputs.resend }}
        run: morning-brief resend --date ${{ inputs.date || '$(TZ=Asia/Seoul date +%F)' }}
      - if: ${{ inputs.update }}
        run: morning-brief update ${{ inputs.date && format('--date {0}', inputs.date) || '' }} ${{ !inputs.send && '--no-send' || '' }}
      - if: ${{ inputs.calibrate }}
        run: morning-brief calibrate --date ${{ inputs.date }}
      - if: ${{ !inputs.calibrate && !inputs.resend && !inputs.update }}
        run: morning-brief daily ${{ inputs.date && format('--date {0}', inputs.date) || '' }} ${{ !inputs.send && github.event_name == 'workflow_dispatch' && '--no-send' || '' }}
      - if: ${{ !inputs.calibrate && !inputs.resend && !inputs.update }}
        name: 결과 요약 (로그 확인용)
        run: morning-brief report --date ${{ inputs.date || '$(TZ=Asia/Seoul date +%F)' }}
      - if: ${{ always() }}                  # 실패·시간 초과여도 계산한 임베딩은 저장
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/morning-brief
          key: emb-${{ github.run_id }}
