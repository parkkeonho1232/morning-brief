name: collect (hourly)
# 매시간 34개 매체 피드 수집 → Supabase article 적재

on:
  # 예약: Supabase pg_cron이 매시 12분(UTC) workflow_dispatch로 깨운다 (0005_dispatch_cron.sql)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DB 없이 피드만 점검 (--dry-run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"                       # 로그를 실시간으로 (멈춘 단계 확인용)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: DATABASE_URL 미설정 시 건너뜀
        if: ${{ env.DATABASE_URL == '' }}
        run: echo "::notice::DATABASE_URL secret이 없어 수집을 건너뜁니다."
      - uses: actions/checkout@v5
        if: ${{ env.DATABASE_URL != '' }}
      - uses: actions/setup-python@v6
        if: ${{ env.DATABASE_URL != '' }}
        with: { python-version: "3.12", cache: pip, cache-dependency-path: collector/pyproject.toml }
      - if: ${{ env.DATABASE_URL != '' }}
        run: pip install ./collector
      - if: ${{ env.DATABASE_URL != '' && !inputs.dry_run }}
        run: morning-brief migrate
      - if: ${{ env.DATABASE_URL != '' }}
        run: morning-brief collect ${{ inputs.dry_run && '--dry-run' || '' }}
