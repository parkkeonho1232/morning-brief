# 매체 목록. Phase 0 검증 결과 반영 (2026-11-15).
# group: 관점 비교용 그룹 — PD가 직접 지정/수정 (시스템이 성향을 단정하지 않음)
# method: rss | sitemap | gnews | api | none
#   sitemap: 매체가 robots.txt에 공개한 검색엔진용 뉴스 사이트맵(news:title, publication_date). 요약 없음.
#   gnews: Google 뉴스 RSS 검색(site:도메인). 공식 경로가 없는 매체 보완용. 링크는 Google 경유 주소,
#          요약 없음, 제목 끝의 " - 매체명"은 제거해서 저장.
#   none이면 수집하지 않음. reason에 제외 사유.
#   (naver는 약관상 저장·AI 입력 금지라 사용하지 않음)
# feed_url: 문자열 1개 또는 목록(섹션 피드 여러 개를 합쳐 쓰는 매체)
# paywall: true면 피드 제목·요약만 사용, 원문 열람 필요 표시
# has_summary: 피드가 요약(리드)을 주는가. false면 제목만으로 묶기·분석
# window_min: 2026-11-15(일) 저녁 측정, 피드 1회분이 덮는 시간 창(분). 평일엔 더 짧아짐.
#   60 미만이면 1시간 간격 수집 시 누락 발생
# tz_naive: true면 pubDate에 시간대가 없거나 비표준 → KST로 간주해 파싱
# terms: RSS 안내 페이지에 명시된 이용 조건 (없으면 생략). 이 툴은 PD 개인·비상업 용도 (2026-11-15 확인)
# yt_news: 해당 매체 공식 유튜브 뉴스 채널 ID — youtube_channels.yaml news_channels와 연결

