# 수집은 YouTube Data API만 사용. 채널 RSS(/feeds/videos.xml)는 youtube.com robots.txt가 Disallow라 쓰지 않음.
#   새 영상: playlistItems.list(업로드 재생목록 = channel_id의 UC→UU) 1유닛/채널
